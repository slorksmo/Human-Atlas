name: Validate atlas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/validate-atlas.mjs
      - run: node scripts/validate-atlas.mjs atlas-female.json
      - run: node scripts/pack-fdi-lesson.mjs --check
      - run: node scripts/validate-interactions.mjs
      - run: npm run build
